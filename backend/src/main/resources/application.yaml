spring:
  data:
    rest:
      base-path: /v1
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": true
      "[mail.smtp.ssl.trust]": "*"
  flyway:
    enabled: false

  application:
    name: tmdt
  datasource:
    url: jdbc:mysql://localhost:3306/oilia-store?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
    username: oilia
    password: 123456

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: true
server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      enabled: true
      charset: UTF-8
      force: true
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 1800000
google:
  client-id: ${GOOGLE_CLIENT_ID:}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
  folder: tmdt
ghn:
  base-url: ${GHN_BASE_URL:https://dev-online-gateway.ghn.vn}
  token: ${GHN_TOKEN:}
  shop-id: ${GHN_SHOP_ID:0}
  from-province-id: ${GHN_FROM_PROVINCE_ID:0}
  from-district-id: ${GHN_FROM_DISTRICT_ID:0}
  from-ward-code: ${GHN_FROM_WARD_CODE:}
  from-address: ${GHN_FROM_ADDRESS:}
  service-type-id: ${GHN_SERVICE_TYPE_ID:2}
  default-weight: ${GHN_DEFAULT_WEIGHT:500}
  default-length: ${GHN_DEFAULT_LENGTH:20}
  default-width: ${GHN_DEFAULT_WIDTH:15}
  default-height: ${GHN_DEFAULT_HEIGHT:10}
logging:
  level:
    org:
      springframework:
        web: INFO

vnpay:
  enabled: ${VNPAY_ENABLED:false}
  tmn-code: ${VNPAY_TMN_CODE:}
  hash-secret: ${VNPAY_HASH_SECRET:}
  pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  query-url: ${VNPAY_QUERY_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
  server-ip: ${VNPAY_SERVER_IP:127.0.0.1}
  return-url: ${VNPAY_RETURN_URL:http://localhost:8080/payments/vnpay/return}
  frontend-result-url: ${VNPAY_FRONTEND_RESULT_URL:http://localhost:5173/payment/vnpay/result}
  sweep-delay-ms: ${VNPAY_SWEEP_DELAY_MS:60000}
