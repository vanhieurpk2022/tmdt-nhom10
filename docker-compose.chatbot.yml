services:
  ollama:
    image: ollama/ollama:latest
    container_name: oilia-ollama
    restart: unless-stopped
    environment:
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_NUM_PARALLEL: "1"
      LLAMA_ARG_REPACK: "0"
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # Tự động pull model khi khởi động lần đầu
  ollama-pull:
    profiles: ["models"]
    image: ollama/ollama:latest
    container_name: oilia-ollama-pull
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Đang đợi Ollama server khởi động..."
        sleep 5
        ollama pull embeddinggemma:300m-qat-q8_0
        ollama pull qwen2.5:3b
        echo "Tải model hoàn tất!"
    restart: "no"

  # Dịch vụ Chatbot AI FastAPI
  chatbot:
    build:
      context: ./chatbot
      dockerfile: Dockerfile
    container_name: oilia-chatbot
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - BASE_PRODUCT_URL=http://localhost:5173/product-detail
      - LLM_MODEL=qwen2.5:3b
      - EMBEDDING_MODEL=embeddinggemma:300m-qat-q8_0
      - TOP_K=4
    volumes:
      - ./chatbot/app:/app/app
      - ./chatbot/runtime:/app/runtime
    depends_on:
      - ollama

volumes:
  ollama_data:
    name: tmdt-nhom10_ollama_data

